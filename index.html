<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Florian</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #f5f7fb;
      --muted: #a9b1c3;
      --line: #2a3040;
      --accent: #d6b36a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at top, #1a1d26 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      background: rgba(23,26,33,.88);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }
    .eyebrow {
      color: var(--accent);
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(40px, 7vw, 72px);
      line-height: .95;
      font-weight: 600;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
      max-width: 42em;
    }
    .actions {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    a.btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--line);
      background: #11141b;
    }
    a.btn.primary {
      background: var(--accent);
      color: #111;
      border-color: transparent;
      font-weight: 600;
    }
    .foot {
      margin-top: 24px;
      font-size: 14px;
      color: #7d8596;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Aurelori</div>
    <h1>Florian</h1>
    <p>
      A small corner on the internet.
      I make experiments, pages, and curious little things.
    </p>

    <div class="actions">
      <a class="btn primary" href="https://github.com/caelori" target="_blank" rel="noreferrer">GitHub</a>
      <a class="btn" href="mailto:hello@aurelori.cc">Contact</a>
    </div>

    <div class="foot">More coming soon.</div>
  </main>
</body>
</html>
